*{

body{

a{

}

}

header{

}

.logo{
font-family:'Orbitron',sans-serif;

font-weight:800;
}

.logo span{
color:var(--green);
}

nav{
display:flex;
gap:30px;
}

nav a{
font-size:16px;
font-weight:700;
transition:.3s;
}

nav a:hover{
color:var(--green);
}

.login{
border:1px solid var(--green);
padding:9px 20px;
color:var(--green);
background:transparent;
}

.menu{
display:none;
font-size:25px;
color:var(--green);
}
